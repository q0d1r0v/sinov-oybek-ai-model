<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinov-Oybek</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --panel: #fff; --text: #1b1b1b; --muted: #6b6b6b; --line: #ddd; --me: #1f5f4a; --me-text: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151716; --panel: #1f2221; --text: #ececea; --muted: #9a9e9b; --line: #333836; --me: #2b7a60; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0; font-size: 17px; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 760px; margin: 0 auto; }
  .m { max-width: 85%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .me { align-self: flex-end; background: var(--me); color: var(--me-text); }
  .err { align-self: center; color: #c0392b; font-size: 14px; }
  form { display: flex; gap: 8px; padding: 12px 16px; width: 100%; max-width: 760px; margin: 0 auto; }
  textarea { flex: 1; resize: none; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: inherit; font: inherit; }
  button { padding: 0 18px; border: 0; border-radius: 10px; background: var(--me); color: var(--me-text); font: inherit; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
</style>
</head>
<body>
<header>
  <h1>Sinov-Oybek</h1>
  <p>Experimental model. It speaks Uzbek and its answers are often wrong, so verify them before use. Everything runs on this computer.</p>
</header>
<main id="log" aria-live="polite"></main>
<form id="f">
  <textarea id="t" rows="2" maxlength="2000" placeholder="Write in Uzbek..." aria-label="Message" autofocus></textarea>
  <button id="b">Send</button>
</form>
<script>
  const log = document.getElementById('log'), t = document.getElementById('t'), b = document.getElementById('b');
  function add(text, cls) {
    const d = document.createElement('div');
    d.className = 'm ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  async function send() {
    const message = t.value.trim();
    if (!message || b.disabled) return;
    t.value = ''; b.disabled = true;
    add(message, 'me');
    const wait = add('Thinking...', 'bot');
    try {
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Error');
      wait.textContent = data.reply || '(empty reply)';
    } catch (e) {
      wait.remove();
      add(e.message || 'Cannot reach the server', 'err');
    }
    b.disabled = false; t.focus();
  }
  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); send(); });
  t.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
